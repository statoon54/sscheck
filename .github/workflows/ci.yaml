name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: golang:1.27-alpine
    steps:
      - name: Install dependencies
        run: apk add --no-cache git curl

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          CODECOV_GPG_FINGERPRINT: 27034E7FDB850E0BBC2C62FF806BB28AED779869
        run: |
          set -eu
          apk add --no-cache gnupg
          # Codecov's keybase account no longer serves this key (it now returns
          # HTTP 404), so fetch it from a keyserver over HTTPS instead, pinned
          # to the full fingerprint rather than a short key id.
          curl -fsSL -o codecov.asc \
            "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x${CODECOV_GPG_FINGERPRINT}"
          gpg --batch --no-default-keyring --keyring ./trustedkeys.gpg --import codecov.asc
          # -f makes curl fail on HTTP errors; without it a 404 body was written
          # to disk and the failure only surfaced later, as a confusing gpg error.
          curl -fsSL -O https://cli.codecov.io/latest/alpine/codecov
          curl -fsSL -O https://cli.codecov.io/latest/alpine/codecov.SHA256SUM
          curl -fsSL -O https://cli.codecov.io/latest/alpine/codecov.SHA256SUM.sig
          # gpgv against the explicit keyring: plain `gpg --verify` consulted the
          # default keyring, not the trustedkeys.gpg the key was imported into.
          gpgv --keyring ./trustedkeys.gpg codecov.SHA256SUM.sig codecov.SHA256SUM
          sha256sum -c codecov.SHA256SUM
          chmod +x codecov
          ./codecov upload-process -t "$CODECOV_TOKEN" -f coverage.out --git-service github

  lint:
    runs-on: ubuntu-latest
    container:
      image: golang:1.27-alpine
    steps:
      - name: Install dependencies
        run: apk add --no-cache git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install golangci-lint from source
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1

      - name: Run golangci-lint
        run: golangci-lint run ./...

  build:
    runs-on: ubuntu-latest
    container:
      image: golang:1.27-alpine
    needs: [test, lint]
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Install git
        run: apk add --no-cache git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          LDFLAGS="-s -w -X 'github.com/statoon54/sscheck/internal/version.Version=${VERSION}' -X 'github.com/statoon54/sscheck/internal/version.Commit=${COMMIT}' -X 'github.com/statoon54/sscheck/internal/version.Date=${DATE}'"

          OUTPUT="sscheck-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            OUTPUT="${OUTPUT}.exe"
          fi

          go build -trimpath -ldflags "${LDFLAGS}" -o "${OUTPUT}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sscheck-${{ matrix.goos }}-${{ matrix.goarch }}
          path: sscheck-*
